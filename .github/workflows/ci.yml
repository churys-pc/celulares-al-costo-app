name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Lectura USB cifrada con el motor de Electron (BoringSSL)
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: npm run check:usb-electron
